<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Tổng hợp tin công nghệ hằng ngày từ báo chí nước ngoài, tóm tắt bằng tiếng Việt.">
<title>TechTin — Tin công nghệ mỗi sáng</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }

  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #21262d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --tc: #3fb950;   /* TechCrunch */
    --verge: #f0883e; /* The Verge */
  }

  html { color-scheme: dark; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }

  header { padding: 20px 0 8px; }
  .logo {
    display: flex; align-items: center; gap: 12px;
    font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;
  }
  .logo .emoji { font-size: 2rem; }
  .logo .accent { color: var(--accent); }
  .updated {
    color: var(--muted); font-size: 0.85rem; margin-top: 6px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--tc); display: inline-block;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .filters { display: flex; gap: 8px; margin: 18px 0 20px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--card);
    color: var(--muted); font: inherit; font-size: 0.85rem; font-weight: 600;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    transition: all .15s ease; min-height: 36px;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #0d1117; }
  .chip:focus-visible, a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
    transition: border-color .15s ease;
  }
  .card:hover { border-color: #30363d; }

  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    padding: 3px 10px; border-radius: 999px; text-transform: uppercase;
  }
  .badge.tc { background: rgba(63,185,80,.15); color: var(--tc); }
  .badge.verge { background: rgba(240,136,62,.15); color: var(--verge); }
  .time { color: var(--muted); font-size: 0.78rem; }

  .card h2 {
    font-size: 1.06rem; font-weight: 700; line-height: 1.45;
    margin-bottom: 8px; letter-spacing: -0.01em;
  }
  .card p {
    color: #b3bdc7; font-size: 0.92rem; margin-bottom: 12px;
  }
  .card a.original {
    color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .card a.original:hover { text-decoration: underline; }
  .en-title {
    display: block; color: var(--muted); font-size: 0.78rem; font-style: italic;
    margin-bottom: 8px; line-height: 1.4;
  }

  .state { text-align: center; color: var(--muted); padding: 60px 0; }
  .state .big { font-size: 2.4rem; margin-bottom: 10px; }

  footer {
    text-align: center; color: var(--muted); font-size: 0.78rem;
    padding: 30px 0 10px; border-top: 1px solid var(--border); margin-top: 30px;
  }
  footer a { color: var(--muted); }

  @media (max-width: 480px) {
    .logo { font-size: 1.25rem; }
    .card { padding: 15px 16px; }
    .card h2 { font-size: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="emoji">📰</span> Tech<span class="accent">Tin</span></div>
    <div class="updated" id="updated"><span class="live-dot"></span> Đang tải tin mới nhất…</div>
  </header>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">Tất cả</button>
    <button class="chip" data-filter="TechCrunch">TechCrunch</button>
    <button class="chip" data-filter="The Verge">The Verge</button>
  </div>

  <main id="feed"><div class="state"><div class="big">⏳</div>Đang tải tin…</div></main>

  <footer>
    Nguồn: <a href="https://techcrunch.com/feed/" target="_blank" rel="noopener">TechCrunch</a> · <a href="https://www.theverge.com/rss/index.xml" target="_blank" rel="noopener">The Verge</a><br>
    Tóm tắt tự động bằng AI — vui lòng đọc bài gốc để biết chi tiết đầy đủ.
  </footer>
</div>

<script>
// ===== CONFIG — sửa thoải mái ở đây =====
const CONFIG = {
  DATA_URL: 'data.json',
  SOURCE_LABELS: { 'TechCrunch': 'tc', 'The Verge': 'verge' },
  MAX_ITEMS: 12,
};

const state = { filter: 'all', items: [] };
const feedEl = document.getElementById('feed');
const updatedEl = document.getElementById('updated');

// ---- helpers ----
function timeAgo(iso) {
  const t = new Date(iso);
  if (isNaN(t)) return '';
  const diffMin = Math.round((Date.now() - t.getTime()) / 60000);
  if (diffMin < 1) return 'vừa xong';
  if (diffMin < 60) return `${diffMin} phút trước`;
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24) return `${diffH} giờ trước`;
  const diffD = Math.round(diffH / 24);
  return diffD === 1 ? 'hôm qua' : `${diffD} ngày trước`;
}

function fmtUpdated(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const mon = String(d.getMonth() + 1).padStart(2, '0');
  return `Cập nhật ${hh}:${mm} · ${day}/${mon}`;
}

// ---- render ----
function render() {
  const items = state.items.filter(i => state.filter === 'all' || i.source === state.filter);
  if (!items.length) {
    feedEl.innerHTML = '<div class="state"><div class="big">🗞️</div>Không có tin nào cho bộ lọc này.</div>';
    return;
  }
  feedEl.innerHTML = items.map(item => {
    const cls = CONFIG.SOURCE_LABELS[item.source] || '';
    return `
      <article class="card">
        <div class="card-top">
          <span class="badge ${cls}">${item.source}</span>
          <span class="time">${timeAgo(item.published)}</span>
        </div>
        <h2>${item.title_vn}</h2>
        ${item.title ? `<span class="en-title">${item.title}</span>` : ''}
        <p>${item.summary_vn}</p>
        <a class="original" href="${item.link}" target="_blank" rel="noopener">Đọc bài gốc →</a>
      </article>`;
  }).join('');
}

// ---- load ----
async function load() {
  try {
    const res = await fetch(CONFIG.DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.items = (data.items || []).slice(0, CONFIG.MAX_ITEMS);
    updatedEl.innerHTML = `<span class="live-dot"></span> ${fmtUpdated(data.updated_at)}`;
    render();
  } catch (err) {
    console.error(err);
    feedEl.innerHTML = '<div class="state"><div class="big">⚠️</div>Không tải được dữ liệu. Thử lại sau nhé.</div>';
  }
}

// ---- filter chips ----
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filter = chip.dataset.filter;
    render();
  });
});

load();
</script>
</body>
</html>
